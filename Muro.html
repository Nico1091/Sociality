<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muro - Sociality</title>
    <link rel="stylesheet" href="Muro.css">
</head>

<body>
    <header class="muro-header">
        <div id="nombreUsuario" class="usuario-nombre"></div>
        <button id="cerrarSesion" class="btn-cerrar">Cerrar Sesión</button>
    </header>

    <main class="muro-main">
        <h1>Bienvenido al Muro</h1>
        <!-- Aquí tu contenido del muro -->
    </main>

    <script>
        // Obtener usuario desde localStorage
        const usuario = JSON.parse(localStorage.getItem("usuarioLogueado"));

        if (!usuario) {
            // Redirigir si no hay usuario logueado
            window.location.href = "index.html";
        } else {
            document.getElementById("nombreUsuario").textContent = usuario.Nombre;
        }

        // Función cerrar sesión
        document.getElementById("cerrarSesion").addEventListener("click", () => {
            localStorage.removeItem("usuarioLogueado");
            window.location.href = "index.html";
        });
    </script>
</body>

</html>
