<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingreso Administrador - Sociality</title>
  <link rel="stylesheet" href="ingresoAdmin.css">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <h1>Ingreso Administrador</h1>
      <form id="loginForm">
        <div class="input-group">
          <label for="usuario">Usuario</label>
          <input type="text" id="usuario" placeholder="Ingrese su usuario" required>
        </div>
        <div class="input-group">
          <label for="contrasena">Contraseña</label>
          <input type="password" id="contrasena" placeholder="Ingrese su contraseña" required>
        </div>
        <button type="submit" class="btn">Ingresar</button>
      </form>
    </div>
  </div>

  <script>
    const loginForm = document.getElementById("loginForm");
    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const usuario = document.getElementById("usuario").value.trim();
      const contrasena = document.getElementById("contrasena").value.trim();
      if (!usuario || !contrasena) return alert("Completa usuario y contraseña");

      try {
        const res = await fetch("http://localhost:3000/ADMIN/admin-login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ usuario, contrasena })
        });

        const j = await res.json();
        if (!res.ok) return alert(j.message || "Usuario o contraseña incorrectos");

        localStorage.setItem("adminLogueado", JSON.stringify({ usuario: j.data.usuario }));
        window.location.href = "Panel.html";
      } catch (err) {
        console.error(err);
        alert("Error en el servidor. Intenta nuevamente.");
      }
    });
  </script>
</body>
</html>
