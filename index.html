<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sociality</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="container">
    <h2>Iniciar Sesión</h2>

    <!-- Inputs para Cédula, Nombre y Contraseña -->
    <input type="text" placeholder="Cédula" id="cedula" />
    <input type="text" placeholder="Nombre" id="nombre" />
    <input type="password" placeholder="Contraseña" id="contrasena" />

    <button onclick="login()">Ingresar</button>

    <p class="link" onclick="window.location.href='registro.html'">Registrar Usuario</p>
    <p class="link" onclick="window.location.href='registroAdmin.html'">Registrar Administrador</p>
    <p class="link">He olvidado mi contraseña</p>
  </div>

  <script>
    async function login() {
      const Cedula = document.getElementById("cedula").value;
      const Nombre = document.getElementById("nombre").value;
      const Contrasena = document.getElementById("contrasena").value;

      if (!Cedula || !Nombre || !Contrasena) {
        alert("Por favor ingresa Cédula, Nombre y Contraseña");
        return;
      }

      try {
        const response = await fetch("http://localhost:3000/usuarios/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ Cedula, Nombre, Contrasena })
        });


        const result = await response.json();

        if (response.ok) {
          // Login exitoso, redirigimos al Muro
          window.location.href = "Muro.html";
        } else {
          alert(result.message);
        }
      } catch (error) {
        console.error("Error al iniciar sesión:", error);
        alert("Ocurrió un error al iniciar sesión");
      }
    }
  </script>
</body>

</html>
